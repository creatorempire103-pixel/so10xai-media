# Wasmer package config. "so10xai" ko apne Wasmer username/namespace se badal dena.
[package]
name = "so10xai/insta-auto-dm"
version = "0.1.0"
description = "Instagram comment/DM keyword auto-DM webhook for @so10xai"

[dependencies]
"wasmer/python" = "^3.12.6"

[fs]
"/src" = "./src"

[[command]]
name = "script"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/src/main.py"]
env = ["PYTHONEXECUTABLE=/bin/python", "HOST=0.0.0.0", "PORT=80"]
